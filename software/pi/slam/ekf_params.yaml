ekf_filter_node:
  ros__parameters:
    frequency: 15.0
    sensor_timeout: 0.25
    two_d_mode: true
    print_diagnostics: false
    debug: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # rf2o laser odometrie: ALLEEN x, y positie (geen yaw/vyaw meer -- 11 aug
    # 2026 bleek rf2o consistent ~2.4-2.8x te overschatten tijdens draaien,
    # geisoleerd bevestigd tegen de externe IMU als grondwaarheid, zie
    # PROBLEMS.md). Rotatie komt nu van imu1 (STM32-onboard-yaw) hieronder.
    odom0: /odom
    odom0_config: [true,  true,  false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # ICM20948 (extern) yaw-rate TIJDELIJK UIT (11 aug 2026, gerichte check):
    # om te isoleren of dit i.p.v. rf2o de bron van de ~2.8x-overschatting is.
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, false]
    imu0_queue_size: 10
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false

    # STM32-onboard-yaw (nieuw, 11 aug 2026, via phoenix_driver.py) -- zelfde
    # sensor als robot_bridge.py's bewezen betrouwbare rotate_to_angle()
    # (stabiel binnen ~0.1 graden in rust). Absolute yaw, vervangt rf2o's
    # onbetrouwbare yaw-fusie hierboven.
    imu1: /imu_stm32
    imu1_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, false,
                  false, false, false]
    imu1_queue_size: 10
    imu1_differential: false
    imu1_relative: false
    imu1_remove_gravitational_acceleration: false
